[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warpSPHPlotting"
version = "0.6.1"
description = "Stateful particle and SPH field visualization with Matplotlib, PyVista, and Vispy"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sph", "warp", "pytorch", "fluid-simulation", "visualization", "plotting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch",
    "warp-lang",
    "numpy",
    "warpSPHCore>=0.6.0",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
# ── Matplotlib (default) backend ────────────────────────────────────────
plot-matplotlib = [
    "matplotlib",
    "ipympl",
    "ipywidgets",
]
# kept for backward-compat; equivalent to plot-matplotlib
notebooks = [
    "matplotlib",
    "ipympl",
    "ipywidgets",
]

# ── PyVista / VTK backend ────────────────────────────────────────────────
plot-pyvista = [
    "pyvista[jupyter]", # Includes the matching notebook/trame adapter.
]

# ── Vispy / OpenGL backend ───────────────────────────────────────────────
plot-vispy = [
    "vispy",
    "jupyter_rfb",   # optional inline support for notebooks
]

# ── Lightweight VTK file export (no pyvista/vispy required) ─────────────
vtk-export = [] # XML writers are bundled; no graphics runtime is required.

# ── Everything ───────────────────────────────────────────────────────────
plot-all = [
    "matplotlib",
    "ipympl",
    "ipywidgets",
    "pyvista[jupyter]",
    "vispy",
    "jupyter_rfb",
]

dev = [
    "pytest",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]
